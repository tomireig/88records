# Infra local. Por ahora solo Postgres (Marketing OS™).
# Redis y MinIO se suman cuando arranque el pipeline de video.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: records
      POSTGRES_PASSWORD: records
      POSTGRES_DB: records
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
